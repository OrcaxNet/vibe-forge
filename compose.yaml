# Vibe Forge local-first compose (OrbStack / Docker).
#
# One command to run everything: `docker compose up --build`.
# Copy .env.example to .env and fill in the access-gate values plus one model
# authentication mode first.
#
# Architecture: SQLite (mounted volume) is the single source of truth; Sandpack
# (in-browser) is the only preview path. No per-project Docker/Vite preview
# containers, no traefik, no IndexedDB, no runtime `npm install`.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vibe-forge-backend:dev
    container_name: vibe-forge-backend
    # `${VAR:-}` keeps `docker compose config` valid even before .env exists.
    # Authentication config is fail-closed: the backend refuses to start when
    # the password or session secret is absent/invalid.
    # Auth is either ANTHROPIC_API_KEY (direct) or ANTHROPIC_AUTH_TOKEN +
    # ANTHROPIC_BASE_URL (bearer-token gateway, e.g. an Anthropic-compatible
    # platform proxy). At least one must be set for the agent loop to run.
    environment:
      PORT: "8787"
      DATABASE_PATH: ${DATABASE_PATH:-/data/vibe-forge.db}
      APP_ENV: ${APP_ENV:-production}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      APP_AUTH_SESSION_SECRET: ${APP_AUTH_SESSION_SECRET:-}
      APP_AUTH_SESSION_TTL_HOURS: ${APP_AUTH_SESSION_TTL_HOURS:-12}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    volumes:
      - vibe-forge-db:/data
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    healthcheck:
      # Readiness: auth config, SQLite, and model credentials must all be ready.
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8787/api/health >/dev/null || exit 1"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    image: vibe-forge-frontend:dev
    container_name: vibe-forge-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      # A responsive nginx serving a stale image must not pass readiness.
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1/build-info.json | grep -Fq '\"revision\":\"${BUILD_REVISION:-local}\"' || exit 1"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vibe-forge-db:
    name: vibe-forge-db
